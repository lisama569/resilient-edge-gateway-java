server.port=0

# ===== 本地反向代理网关配置 =====
# 上游节点（进程内模拟，无真实网络依赖）
gateway.nodes[0].id=node-a
gateway.nodes[0].weight=3
gateway.nodes[0].enabled=true
gateway.nodes[0].timeout-ms=200

gateway.nodes[1].id=node-b
gateway.nodes[1].weight=2
gateway.nodes[1].enabled=true
gateway.nodes[1].timeout-ms=200

gateway.nodes[2].id=node-c
gateway.nodes[2].weight=1
gateway.nodes[2].enabled=true
gateway.nodes[2].timeout-ms=200

# 调用方维度默认每秒配额（0 表示不限制）
gateway.caller-default-permits-per-sec=100
# 上游节点维度默认每秒配额
gateway.upstream-default-permits-per-sec=100
# 连续失败 2 次即熔断隔离
gateway.failure-threshold=2
# 熔断 300ms 后允许半开试探
gateway.recover-after-ms=300
# 幂等请求最多尝试 3 个节点；非幂等请求恒为 1
gateway.max-attempts=3

# 打印请求特征、命中节点与判定依据
logging.level.com.github.lisama569.resilientedgegatewayjava.gateway=INFO
